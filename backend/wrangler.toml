name = "mita-oni"
main = "src/index.ts"
compatibility_date = "2026-11-15"

# フロントエンドのビルド成果物を同じ Worker から配信する（同一オリジンになるので CORS 不要）
# /api/* だけを Worker 側で処理し、それ以外は静的アセット。未知のパスは index.html を返す（SPA）
[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "RoomDO" },
  { name = "LOBBY", class_name = "LobbyDO" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "LobbyDO"]

[[d1_databases]]
binding = "DB"
database_name = "mita-oni"
database_id = "1778c03b-8ec7-41ce-b4ab-36851e356723"
migrations_dir = "migrations"
